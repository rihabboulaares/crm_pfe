name: Deploy CRM VPS

on:
  push:
    branches:
      - frontend
      - clean-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS with Docker Compose and Rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -e

            rollback() {
              echo "=== ROLLBACK STARTED ==="

              cd /opt/viewisecrm-devops

              docker tag viewisecrm-backend-last-success:backup viewisecrm-devops-backend:latest
              docker tag viewisecrm-frontend-last-success:backup viewisecrm-devops-frontend:latest
              docker tag viewisecrm-nginx-last-success:backup nginx:alpine

              docker compose up -d backend frontend nginx

              echo "=== ROLLBACK FINISHED ==="
            }

            trap 'rollback' ERR

            echo "=== BACKUP CURRENT SUCCESSFUL IMAGES ==="
            docker commit viewisecrm-backend viewisecrm-backend-last-success:backup
            docker commit viewisecrm-frontend viewisecrm-frontend-last-success:backup
            docker commit viewisecrm-nginx viewisecrm-nginx-last-success:backup

            echo "=== UPDATE FRONTEND CODE ==="
            cd /opt/crm-frontend
            git fetch origin frontend
            git reset --hard origin/frontend

            echo "=== UPDATE BACKEND CODE ==="
            cd /opt/crm-pfe
            git fetch origin clean-backend
            git reset --hard origin/clean-backend

            echo "=== REBUILD DOCKER SERVICES ==="
            cd /opt/viewisecrm-devops
            docker compose up -d --build backend frontend nginx

            echo "=== APPLY MIGRATIONS ==="
            docker compose exec -T backend python manage.py migrate --noinput

            echo "=== COLLECT STATIC ==="
            docker compose exec -T backend python manage.py collectstatic --noinput

            echo "=== HEALTHCHECK ==="
            FRONT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080)
            API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/)

            echo "Frontend status: $FRONT_STATUS"
            echo "API status: $API_STATUS"

            if [ "$FRONT_STATUS" != "200" ]; then
              echo "Frontend healthcheck failed"
              exit 1
            fi

            if [ "$API_STATUS" != "200" ] && [ "$API_STATUS" != "401" ]; then
              echo "API healthcheck failed"
              exit 1
            fi

            trap - ERR

            echo "Healthcheck passed"

            echo "=== CHECK CONTAINERS ==="
            docker compose ps

            echo "=== DEPLOYMENT SUMMARY ==="
            cat <<EOF >> $GITHUB_STEP_SUMMARY
            # 🚀 ViewiseCRM Deployment Report

            | Élément | Statut |
            |---|---|
            | Frontend React | ✅ Running |
            | Backend Django | ✅ Running |
            | PostgreSQL | ✅ Running |
            | Redis | ✅ Running |
            | Nginx | ✅ Running |
            | Prometheus | ✅ Running |
            | Grafana | ✅ Running |
            | cAdvisor | ✅ Running |
            | Healthcheck Frontend | ✅ HTTP $FRONT_STATUS |
            | Healthcheck API | ✅ HTTP $API_STATUS |
            | Rollback automatique | ✅ Disponible |

            **Résultat final : ✅ Déploiement réussi**
            EOF

            echo "=== DEPLOYMENT FINISHED ==="