name: Deploy CRM VPS

on:
  push:
    branches:
      - frontend
      - clean-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy CRM to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          BRANCH: ${{ github.ref_name }}

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 45m
          envs: BRANCH

          script: |
            set -e

            echo "=========================================="
            echo " CRM AUTOMATIC DEPLOYMENT"
            echo " Branch: $BRANCH"
            echo "=========================================="

            COMPOSE_DIR="/opt/viewisecrm-devops"


            # ==========================================
            # BACKEND
            # ==========================================

            if [ "$BRANCH" = "clean-backend" ]; then

              echo "=== BACKEND DEPLOYMENT ==="

              cd /opt/crm-pfe

              echo "=== FETCH BACKEND ==="

              git fetch origin clean-backend

              git reset --hard origin/clean-backend


              echo "=== BUILD BACKEND ==="

              cd $COMPOSE_DIR

              docker compose build backend


              echo "=== START BACKEND ==="

              docker compose up -d backend


              echo "=== WAIT BACKEND ==="

              sleep 10


              echo "=== DATABASE MIGRATIONS ==="

              docker compose exec -T backend \
                python manage.py migrate --noinput


              echo "=== COLLECT STATIC ==="

              docker compose exec -T backend \
                python manage.py collectstatic --noinput


              echo "=== BACKEND LOGS ==="

              docker compose logs --tail=50 backend


              echo "=== BACKEND DEPLOYED ==="

            fi


            # ==========================================
            # FRONTEND
            # ==========================================

            if [ "$BRANCH" = "frontend" ]; then

              echo "=== FRONTEND DEPLOYMENT ==="

              cd /opt/crm-frontend

              echo "=== FETCH FRONTEND ==="

              git fetch origin frontend

              git reset --hard origin/frontend


              echo "=== BUILD FRONTEND ==="

              cd $COMPOSE_DIR

              docker compose build frontend


              echo "=== START FRONTEND ==="

              docker compose up -d frontend


              echo "=== RELOAD NGINX ==="

              docker compose up -d nginx


              echo "=== FRONTEND LOGS ==="

              docker compose logs --tail=50 frontend


              echo "=== FRONTEND DEPLOYED ==="

            fi


            # ==========================================
            # FINAL CHECK
            # ==========================================

            cd $COMPOSE_DIR

            echo "=== CONTAINERS ==="

            docker compose ps


            echo "=== WAIT BEFORE HEALTHCHECK ==="

            sleep 10


            FRONT_STATUS=$(curl -s -o /dev/null \
              -w "%{http_code}" \
              http://127.0.0.1:8080 || echo "000")


            API_STATUS=$(curl -s -o /dev/null \
              -w "%{http_code}" \
              http://127.0.0.1:8080/api/ || echo "000")


            echo "=========================================="
            echo " DEPLOYMENT REPORT"
            echo "=========================================="
            echo "Branch deployed : $BRANCH"
            echo "Frontend HTTP   : $FRONT_STATUS"
            echo "Backend HTTP    : $API_STATUS"
            echo "=========================================="

            echo "=== DEPLOYMENT FINISHED ==="
