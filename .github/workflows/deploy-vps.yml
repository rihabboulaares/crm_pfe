name: Deploy CRM VPS

on:
  push:
    branches:
      - frontend
      - clean-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e

            echo "=== FRONTEND DEPLOY ==="
            cd /opt/crm-frontend
            git fetch origin frontend
            git reset --hard origin/frontend
            npm install
            npm run build

            echo "=== BACKEND DEPLOY ==="
            cd /opt/crm-pfe
            git fetch origin clean-backend
            git reset --hard origin/clean-backend

            source venv/bin/activate
            pip install -r requirements.txt
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput

            echo "=== RESTART GUNICORN ==="
            pkill -f "gunicorn config.wsgi:application" || true
            nohup gunicorn config.wsgi:application --bind 127.0.0.1:8000 --workers 2 --timeout 180 > gunicorn.log 2>&1 &

            echo "=== RELOAD NGINX ==="
            nginx -t
            systemctl reload nginx

            echo "=== DEPLOYMENT FINISHED ==="