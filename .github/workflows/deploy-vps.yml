name: Deploy CRM VPS

on:
  push:
    branches:
      - clean-backend
      - frontend

concurrency:
  group: crm-vps-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy CRM
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 45m
          envs: DEPLOY_BRANCH

          script: |
            set -e

            COMPOSE_DIR="/opt/viewisecrm-devops"

            echo "=========================================="
            echo " VIEWISE CRM AUTOMATIC DEPLOYMENT"
            echo "=========================================="
            echo "Branch: $DEPLOY_BRANCH"

            # ==========================================
            # BACKEND
            # ==========================================

            if [ "$DEPLOY_BRANCH" = "clean-backend" ]; then

              echo "=== UPDATE BACKEND ==="

              cd /opt/crm-pfe

              git fetch origin clean-backend
              git reset --hard origin/clean-backend

              echo "Backend commit:"
              git log -1 --oneline

              if [ ! -f Dockerfile ]; then
                echo "ERROR: Backend Dockerfile not found"
                exit 1
              fi

              cd "$COMPOSE_DIR"

              echo "=== BUILD BACKEND ==="
              docker compose build backend

              echo "=== START BACKEND ==="
              docker compose up -d backend

              echo "=== WAIT BACKEND ==="
              sleep 10

              echo "=== MIGRATIONS ==="
              docker compose exec -T backend \
                python manage.py migrate --noinput

              echo "=== COLLECT STATIC ==="
              docker compose exec -T backend \
                python manage.py collectstatic --noinput

              echo "=== RESTART NGINX ==="
              docker compose restart nginx

            fi


            # ==========================================
            # FRONTEND
            # ==========================================

            if [ "$DEPLOY_BRANCH" = "frontend" ]; then

              echo "=== UPDATE FRONTEND ==="

              cd /opt/crm-frontend

              git fetch origin frontend
              git reset --hard origin/frontend

              echo "Frontend commit:"
              git log -1 --oneline

              if [ ! -f Dockerfile ]; then
                echo "ERROR: Frontend Dockerfile not found"
                exit 1
              fi

              cd "$COMPOSE_DIR"

              echo "=== BUILD FRONTEND ==="
              docker compose build frontend

              echo "=== START FRONTEND ==="
              docker compose up -d frontend

              echo "=== RESTART NGINX ==="
              docker compose restart nginx

            fi


            # ==========================================
            # STATUS
            # ==========================================

            cd "$COMPOSE_DIR"

            echo "=== CONTAINERS ==="
            docker compose ps


            # ==========================================
            # FRONTEND HEALTHCHECK
            # ==========================================

            echo "=== FRONTEND HEALTHCHECK ==="

            FRONT_STATUS="000"

            for i in 1 2 3 4 5 6; do

              FRONT_STATUS=$(curl -s \
                -o /dev/null \
                -w "%{http_code}" \
                http://127.0.0.1:8080 || true)

              echo "Attempt $i - Frontend HTTP: $FRONT_STATUS"

              if [ "$FRONT_STATUS" = "200" ]; then
                break
              fi

              sleep 5

            done

            if [ "$FRONT_STATUS" != "200" ]; then

              echo "ERROR: Frontend unavailable"

              docker compose logs --tail=100 frontend
              docker compose logs --tail=100 nginx

              exit 1

            fi


            # ==========================================
            # API HEALTHCHECK
            # ==========================================

            echo "=== API HEALTHCHECK ==="

            API_STATUS="000"

            for i in 1 2 3 4 5 6; do

              API_STATUS=$(curl -s \
                -o /dev/null \
                -w "%{http_code}" \
                http://127.0.0.1:8080/api/ || true)

              echo "Attempt $i - API HTTP: $API_STATUS"

              if [ "$API_STATUS" != "000" ] && \
                 [ "$API_STATUS" != "502" ] && \
                 [ "$API_STATUS" != "503" ] && \
                 [ "$API_STATUS" != "504" ] && \
                 [ "$API_STATUS" != "500" ]; then
                break
              fi

              sleep 5

            done

            if [ "$API_STATUS" = "000" ] || \
               [ "$API_STATUS" = "500" ] || \
               [ "$API_STATUS" = "502" ] || \
               [ "$API_STATUS" = "503" ] || \
               [ "$API_STATUS" = "504" ]; then

              echo "ERROR: Backend unavailable"

              docker compose logs --tail=100 backend
              docker compose logs --tail=100 nginx

              exit 1

            fi


            echo ""
            echo "=========================================="
            echo " DEPLOYMENT SUCCESSFUL"
            echo "=========================================="
            echo "Branch   : $DEPLOY_BRANCH"
            echo "Frontend : HTTP $FRONT_STATUS"
            echo "API      : HTTP $API_STATUS"
            echo "=========================================="