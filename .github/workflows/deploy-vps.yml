name: Deploy CRM VPS

on:
  push:
    branches:
      - clean-backend
      - frontend

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy CRM
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          # Le frontend peut prendre ~15 minutes à compiler.
          command_timeout: 45m

          envs: DEPLOY_BRANCH

          script: |
            set -e

            echo "=========================================="
            echo "        VIEWISE CRM DEPLOYMENT"
            echo "=========================================="
            echo "Branch: $DEPLOY_BRANCH"
            echo "Date: $(date)"
            echo "=========================================="

            COMPOSE_DIR="/opt/viewisecrm-devops"

            # ==========================================
            # BACKEND
            # ==========================================

            if [ "$DEPLOY_BRANCH" = "clean-backend" ]; then

              echo ""
              echo "=== BACKEND DEPLOYMENT START ==="

              cd /opt/crm-pfe

              echo "=== FETCH BACKEND ==="
              git fetch origin clean-backend

              echo "=== UPDATE BACKEND ==="
              git reset --hard origin/clean-backend

              echo "=== CURRENT BACKEND COMMIT ==="
              git log -1 --oneline

              echo "=== CHECK DOCKERFILE ==="

              if [ ! -f Dockerfile ]; then
                echo "ERROR: /opt/crm-pfe/Dockerfile not found"
                exit 1
              fi

              cd "$COMPOSE_DIR"

              echo "=== BUILD BACKEND ==="
              docker compose build backend

              echo "=== START BACKEND ==="
              docker compose up -d backend

              echo "=== WAIT BACKEND ==="
              sleep 10

              echo "=== MIGRATIONS ==="
              docker compose exec -T backend \
                python manage.py migrate --noinput

              echo "=== COLLECT STATIC ==="
              docker compose exec -T backend \
                python manage.py collectstatic --noinput

              echo "=== RESTART NGINX ==="
              docker compose restart nginx

              echo "=== WAIT NGINX ==="
              sleep 5

              echo "=== BACKEND LOGS ==="
              docker compose logs --tail=50 backend

              echo "=== BACKEND DEPLOYMENT FINISHED ==="

            fi


            # ==========================================
            # FRONTEND
            # ==========================================

            if [ "$DEPLOY_BRANCH" = "frontend" ]; then

              echo ""
              echo "=== FRONTEND DEPLOYMENT START ==="

              cd /opt/crm-frontend

              echo "=== FETCH FRONTEND ==="
              git fetch origin frontend

              echo "=== UPDATE FRONTEND ==="
              git reset --hard origin/frontend

              echo "=== CURRENT FRONTEND COMMIT ==="
              git log -1 --oneline

              echo "=== CHECK DOCKERFILE ==="

              if [ ! -f Dockerfile ]; then
                echo "ERROR: /opt/crm-frontend/Dockerfile not found"
                exit 1
              fi

              cd "$COMPOSE_DIR"

              echo "=== BUILD FRONTEND ==="
              docker compose build frontend

              echo "=== START FRONTEND ==="
              docker compose up -d frontend

              echo "=== RESTART NGINX ==="
              docker compose restart nginx

              echo "=== WAIT FRONTEND ==="
              sleep 5

              echo "=== FRONTEND LOGS ==="
              docker compose logs --tail=50 frontend

              echo "=== FRONTEND DEPLOYMENT FINISHED ==="

            fi


            # ==========================================
            # FINAL CHECKS
            # ==========================================

            cd "$COMPOSE_DIR"

            echo ""
            echo "=== CONTAINER STATUS ==="
            docker compose ps

            echo ""
            echo "=== FRONTEND HEALTHCHECK ==="

            FRONT_STATUS=$(curl -s \
              -o /dev/null \
              -w "%{http_code}" \
              http://127.0.0.1:8080 || true)

            echo "Frontend HTTP status: $FRONT_STATUS"

            if [ "$FRONT_STATUS" != "200" ]; then

              echo "ERROR: Frontend healthcheck failed"

              echo "=== NGINX LOGS ==="
              docker compose logs --tail=100 nginx

              exit 1
            fi


            echo ""
            echo "=== API HEALTHCHECK ==="

            API_STATUS=$(curl -s \
              -o /dev/null \
              -w "%{http_code}" \
              http://127.0.0.1:8080/api/ || true)

            echo "API HTTP status: $API_STATUS"

            if [ "$API_STATUS" = "502" ] || [ "$API_STATUS" = "000" ]; then

              echo "ERROR: Backend is unreachable"

              echo "=== BACKEND LOGS ==="
              docker compose logs --tail=100 backend

              echo "=== NGINX LOGS ==="
              docker compose logs --tail=100 nginx

              exit 1
            fi


            echo ""
            echo "=========================================="
            echo "        DEPLOYMENT SUCCESSFUL"
            echo "=========================================="
            echo "Branch      : $DEPLOY_BRANCH"
            echo "Frontend    : HTTP $FRONT_STATUS"
            echo "Backend API : HTTP $API_STATUS"
            echo "=========================================="
